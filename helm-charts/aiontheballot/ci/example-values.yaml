# Rendered in CI (helm lint/template) to exercise every template. Fictional hosts, placeholder secret names.
aiontheballot-migrations:
  image: { repository: registry.example/aiontheballot/migrations, tag: 0.1.0.abc1234 }
  databaseUrlSecret: { name: aiontheballot-owner-db }
aiontheballot-api:
  image: { repository: registry.example/aiontheballot/api, tag: 0.1.0.abc1234 }
  platformName: Plataforma de ejemplo
  auth:
    adminOrigin: https://admin.example-platform.test
    databaseUrlSecret: { name: aiontheballot-auth-db }
    betterAuthSecret: { name: aiontheballot-better-auth }
    cleanup:
      envFrom: [{ secretRef: { name: aiontheballot-api-glitchtip } }]
  mail:
    smtpUrlSecret: { name: aiontheballot-mail }
    from: avisos@example-platform.test
  worker:
    databaseUrlSecret: { name: aiontheballot-worker-db }
    tokenSecret: { name: aiontheballot-worker-token }
    envFrom: [{ secretRef: { name: aiontheballot-api-glitchtip } }]
    networkPolicy:
      database: { namespace: example-postgres }
      errorTracking:
        namespace: example-glitchtip
        podLabels: { app.kubernetes.io/name: glitchtip, app.kubernetes.io/component: web }
  # Renders the fetcher and its network policy, so lint covers them (ADR-0007).
  fetcher:
    enabled: true
    tokenSecret: { name: aiontheballot-fetcher-token }
    envFrom: [{ secretRef: { name: aiontheballot-fetcher-archive, optional: true } }]
  fileSweep:
    databaseUrlSecret: { name: aiontheballot-sweeper-db }
  reports:
    anonymize:
      databaseUrlSecret: { name: aiontheballot-worker-db, key: DATABASE_URL }
      envFrom: [{ secretRef: { name: aiontheballot-api-glitchtip } }]
aiontheballot-web:
  image: { repository: registry.example/aiontheballot/web, tag: 0.1.0.abc1234 }
  route:
    enabled: true
    parentRefs: [{ name: example-gateway, namespace: example-gateway }]
    hostnames: [example-tenant.test]
    apiPaths: [/api/public]
    # Renders the per-address limits, so lint covers them.
    trafficPolicy: { rateLimit: { forms: 60, errorRelay: 60, analyticsRelay: 300, images: 300 } }
  # Renders the network policy, so lint covers it.
  networkPolicy:
    enabled: true
    gateways:
      - namespace: envoy-gateway-system
        podLabels: { gateway.envoyproxy.io/owning-gateway-name: example-gateway }
  # Renders the preview's settings, and the policy's rule for the admin, so lint covers them.
  preview:
    enabled: true
    host: aiontheballot-preview.internal
    tokenSecret: { name: aiontheballot-preview-token }
aiontheballot-admin:
  image: { repository: registry.example/aiontheballot/admin, tag: 0.1.0.abc1234 }
  preview:
    enabled: true
    host: aiontheballot-preview.internal
    tokenSecret: { name: aiontheballot-preview-token }
  route:
    enabled: true
    parentRefs: [{ name: example-gateway, namespace: example-gateway }]
    hostnames: [admin.example-platform.test]
    # Renders the per-address limit, so lint covers it.
    trafficPolicy: { rateLimit: { errorRelay: 60 } }

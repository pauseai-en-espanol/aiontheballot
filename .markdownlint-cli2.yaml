config:
  default: true
  MD013:
    line_length: 120
    heading_line_length: 120
    code_block_line_length: 120
    tables: false
  MD024:
    siblings_only: true
  MD033: false
globs:
  - '**/*.md'
ignores:
  - '**/node_modules/**'
  - '**/CHANGELOG.md'
  - '.changeset/*.md'
  - 'LICENSE*'
  - 'docs/BRIEF.md'
  # Managed by turbo (agent guidance block), kept as turbo writes it
  - 'AGENTS.md'

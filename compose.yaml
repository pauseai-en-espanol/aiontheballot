# Local development and test database, mirroring what production needs: Postgres 18 and the same roles (an
# owner plus the non-owner runtime roles, created by db/local/init.sh). See ADR-0001 and ADR-0002 §2.
#
#   pnpm db:up        # start Postgres on :5432 (override with AIONTHEBALLOT_PG_PORT)
#   pnpm db:migrate   # apply migrations and refresh db/schema.sql
#   docker compose down -v   # stop and wipe the database

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: aiontheballot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      AIONTHEBALLOT_OWNER_PASSWORD: ${AIONTHEBALLOT_OWNER_PASSWORD:-dev-only-owner}
      AIONTHEBALLOT_WEB_PASSWORD: ${AIONTHEBALLOT_WEB_PASSWORD:-dev-only-web}
      AIONTHEBALLOT_ADMIN_PASSWORD: ${AIONTHEBALLOT_ADMIN_PASSWORD:-dev-only-admin}
      AIONTHEBALLOT_WORKER_PASSWORD: ${AIONTHEBALLOT_WORKER_PASSWORD:-dev-only-worker}
      AIONTHEBALLOT_AUTH_PASSWORD: ${AIONTHEBALLOT_AUTH_PASSWORD:-dev-only-auth}
      AIONTHEBALLOT_SWEEPER_PASSWORD: ${AIONTHEBALLOT_SWEEPER_PASSWORD:-dev-only-sweeper}
      AIONTHEBALLOT_PREVIEW_PASSWORD: ${AIONTHEBALLOT_PREVIEW_PASSWORD:-dev-only-preview}
    # This machine only: the superuser's and the roles' passwords are the public defaults above (PLAN R208).
    ports:
      - '127.0.0.1:${AIONTHEBALLOT_PG_PORT:-5432}:5432'
    volumes:
      - aiontheballot-pg-data:/var/lib/postgresql
      - ./db/local/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aiontheballot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aiontheballot-pg-data:

replicaCount: 2
image:
  repository: aiontheballot/web
  tag: ''
  pullPolicy: IfNotPresent
service:
  port: 3000
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: '1'
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
# Extra environment (plain values, or secretKeyRef for credentials sealed in gitops)
env: []
envFrom: []

# Gateway API HTTPRoute (halyard `route:` convention). Hostnames and gateway come from gitops values.
route:
  enabled: false
  # e.g. - name: gateway-public
  #        namespace: gateway-public
  parentRefs: []
  hostnames: []
  annotations: {}
  trafficPolicy:
    enabled: true
  apiPaths: []

# The API service: the proxy reads routing data from it (API_URL), and public API paths on public hosts are routed to
# it (none yet).
api:
  # Defaults to <release>-api, the API service of the same release.
  serviceName: ''
  servicePort: 3001

# The platform domain, for tenants reachable by path (https://<platformHost>/<slug>/…). Optional (ADR-0002).
platformHost: ''

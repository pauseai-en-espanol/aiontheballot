enabled: true
image:
  repository: ballot/migrations
  tag: ''
  pullPolicy: IfNotPresent
databaseUrlSecret:
  name: ''
  key: DATABASE_URL
backoffLimit: 1
activeDeadlineSeconds: 300
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ballot-admin.fullname" . }}
  labels:
    {{- include "ballot-admin.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml (required "route.parentRefs is required when route.enabled" .Values.route.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "route.hostnames is required when route.enabled" .Values.route.hostnames) | nindent 4 }}
  rules:

    # The API lives under /api on the admin host: same origin, so host-only session cookies just work
    # (ADR-0003 §1).
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.api.serviceName | default (printf "%s-api" .Release.Name) }}
          port: {{ .Values.api.servicePort }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ballot-admin.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}

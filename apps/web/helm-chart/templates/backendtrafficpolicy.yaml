{{- if and .Values.route.enabled .Values.route.trafficPolicy.enabled }}
# Envoy Gateway policy for this HTTPRoute (as in gifcept):
# - retry connection-level failures only (never 5xx), so a request that may have been processed is never replayed;
# - close idle upstream connections (60s) before the pods would (keep-alive 75s), avoiding reset races.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "ballot-web.fullname" . }}
  labels:
    {{- include "ballot-web.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "ballot-web.fullname" . }}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset
  timeout:
    http:
      connectionIdleTimeout: 60s
{{- end }}

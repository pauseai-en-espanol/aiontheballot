  databaseUrlSecret: { name: ballot-owner-db }
ballot-api:
  image: { repository: registry.example/ballot/api, tag: 0.1.0.abc1234 }
ballot-web:
  image: { repository: registry.example/ballot/web, tag: 0.1.0.abc1234 }
  route:
    enabled: true
    parentRefs: [{ name: gateway-public, namespace: gateway-public }]

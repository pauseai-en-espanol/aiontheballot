apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiontheballot-web.fullname" . }}
  labels:
    {{- include "aiontheballot-web.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aiontheballot-web.selectorLabels" . | nindent 4 }}
---
# Every ready pod's address, by name (clusterIP None): the API tells each replica when a site changes, so each refetches
# it at once (PLAN R151). The pods answer that only on an internal address, never through the gateway.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiontheballot-web.fullname" . }}-pods
  labels:
    {{- include "aiontheballot-web.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aiontheballot-web.selectorLabels" . | nindent 4 }}
